AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: Turnity backend scaffold for AWS SAM

Globals:
  Function:
    Runtime: nodejs20.x
    Timeout: 10
    MemorySize: 256
    CodeUri: ./
    Environment:
      Variables:
        APP_ENV: dev
        CORS_ORIGIN: http://localhost:5173
        TU_API_BASE_URL: https://restapi.tu.ac.th/api/v1/auth/Ad
        DDB_TABLE_NAME: !Ref TurnityTable
        POWERTOOLS_SERVICE_NAME: turnity-backend

Resources:
  TurnityApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      CorsConfiguration:
        AllowMethods:
          - GET
          - POST
          - PUT
          - DELETE
          - OPTIONS
        AllowOrigins:
          - http://localhost:5173
        AllowHeaders:
          - Content-Type
          - Authorization

  TurnityTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
        - AttributeName: GSI1PK
          AttributeType: S
        - AttributeName: GSI1SK
          AttributeType: S
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE
      GlobalSecondaryIndexes:
        - IndexName: GSI1
          KeySchema:
            - AttributeName: GSI1PK
              KeyType: HASH
            - AttributeName: GSI1SK
              KeyType: RANGE
          Projection:
            ProjectionType: ALL

  AuthLoginFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: functions/auth-login/index.handler
      Policies:
        - AWSLambdaBasicExecutionRole
      Events:
        AuthLogin:
          Type: HttpApi
          Properties:
            ApiId: !Ref TurnityApi
            Path: /auth/login
            Method: POST

  CoursesListFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: functions/courses-list/index.handler
      Policies:
        - AWSLambdaBasicExecutionRole
        - DynamoDBCrudPolicy:
            TableName: !Ref TurnityTable
      Events:
        CoursesList:
          Type: HttpApi
          Properties:
            ApiId: !Ref TurnityApi
            Path: /courses
            Method: GET

  CoursesCreateFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: functions/courses-create/index.handler
      Policies:
        - AWSLambdaBasicExecutionRole
        - DynamoDBCrudPolicy:
            TableName: !Ref TurnityTable
      Events:
        CoursesCreate:
          Type: HttpApi
          Properties:
            ApiId: !Ref TurnityApi
            Path: /courses
            Method: POST

  CourseDetailFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: functions/course-detail/index.handler
      Policies:
        - AWSLambdaBasicExecutionRole
        - DynamoDBCrudPolicy:
            TableName: !Ref TurnityTable
      Events:
        CourseDetail:
          Type: HttpApi
          Properties:
            ApiId: !Ref TurnityApi
            Path: /courses/{courseId}
            Method: GET

  CourseStudentsFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: functions/course-students/index.handler
      Policies:
        - AWSLambdaBasicExecutionRole
        - DynamoDBCrudPolicy:
            TableName: !Ref TurnityTable
      Events:
        CourseStudentsList:
          Type: HttpApi
          Properties:
            ApiId: !Ref TurnityApi
            Path: /courses/{courseId}/students
            Method: GET
        CourseStudentsAdd:
          Type: HttpApi
          Properties:
            ApiId: !Ref TurnityApi
            Path: /courses/{courseId}/students
            Method: POST
        CourseStudentsRemove:
          Type: HttpApi
          Properties:
            ApiId: !Ref TurnityApi
            Path: /courses/{courseId}/students/{studentId}
            Method: DELETE

Outputs:
  ApiBaseUrl:
    Description: HTTP API base URL
    Value: !Sub https://${TurnityApi}.execute-api.${AWS::Region}.amazonaws.com
  TableName:
    Description: DynamoDB table name
    Value: !Ref TurnityTable
