AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: Turnity backend scaffold for AWS SAM

Globals:
  Function:
    Runtime: nodejs20.x
    Timeout: 10
    MemorySize: 256
    CodeUri: ./
    Environment:
      Variables:
        APP_ENV: dev
        CORS_ORIGIN: http://localhost:5173
        TU_API_BASE_URL: https://restapi.tu.ac.th/api/v1/auth/Ad
        DDB_TABLE_NAME: !Ref TurnityTable
        UPLOADS_BUCKET_NAME: !Ref UploadsBucket
        AUTH_TOKEN_SECRET: turnity-prod-secret-change-me-in-console
        LOCAL_AUTH_SALT: turnity-prod-salt-change-me-in-console
        TU_API_APPLICATION_KEY: ""
        POWERTOOLS_SERVICE_NAME: turnity-backend

Resources:
  TurnityApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      CorsConfiguration:
        AllowMethods:
          - GET
          - POST
          - PUT
          - DELETE
          - OPTIONS
        AllowOrigins:
          - http://localhost:5173
        AllowHeaders:
          - Content-Type
          - Authorization

  TurnityTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
        - AttributeName: GSI1PK
          AttributeType: S
        - AttributeName: GSI1SK
          AttributeType: S
        - AttributeName: GSI2PK
          AttributeType: S
        - AttributeName: GSI2SK
          AttributeType: S
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE
      GlobalSecondaryIndexes:
        - IndexName: GSI1
          KeySchema:
            - AttributeName: GSI1PK
              KeyType: HASH
            - AttributeName: GSI1SK
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
        - IndexName: GSI2
          KeySchema:
            - AttributeName: GSI2PK
              KeyType: HASH
            - AttributeName: GSI2SK
              KeyType: RANGE
          Projection:
            ProjectionType: ALL

  UploadsBucket:
    Type: AWS::S3::Bucket
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      CorsConfiguration:
        CorsRules:
          - AllowedHeaders:
              - "*"
            AllowedMethods:
              - GET
              - PUT
              - POST
              - HEAD
            AllowedOrigins:
              - "*"
            MaxAge: 3000

  AuthLoginFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: functions/auth-login/index.handler
      Role: !Sub "arn:aws:iam::${AWS::AccountId}:role/LabRole"
      Events:
        AuthLogin:
          Type: HttpApi
          Properties:
            ApiId: !Ref TurnityApi
            Path: /auth/login
            Method: POST

  AuthLogoutFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: functions/auth-logout/index.handler
      Role: !Sub "arn:aws:iam::${AWS::AccountId}:role/LabRole"
      Events:
        AuthLogout:
          Type: HttpApi
          Properties:
            ApiId: !Ref TurnityApi
            Path: /auth/logout
            Method: POST

  AuthMeFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: functions/auth-me/index.handler
      Role: !Sub "arn:aws:iam::${AWS::AccountId}:role/LabRole"
      Events:
        AuthMe:
          Type: HttpApi
          Properties:
            ApiId: !Ref TurnityApi
            Path: /auth/me
            Method: GET

  CoursesListFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: functions/courses-list/index.handler
      Role: !Sub "arn:aws:iam::${AWS::AccountId}:role/LabRole"
      Events:
        CoursesList:
          Type: HttpApi
          Properties:
            ApiId: !Ref TurnityApi
            Path: /courses
            Method: GET

  CoursesCreateFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: functions/courses-create/index.handler
      Role: !Sub "arn:aws:iam::${AWS::AccountId}:role/LabRole"
      Events:
        CoursesCreate:
          Type: HttpApi
          Properties:
            ApiId: !Ref TurnityApi
            Path: /courses
