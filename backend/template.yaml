Outputs:
  ApiBaseUrl:
    Description: HTTP API base URL
    Value: !Sub https://${TurnityApi}.execute-api.${AWS::Region}.amazonaws.com
  TableName:
    Description: DynamoDB table name
    Value: !Ref TurnityTable
