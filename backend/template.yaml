    Properties:
      Handler: functions/courses-update/index.handler
      Role: !Sub "arn:aws:iam::${AWS::AccountId}:role/LabRole"
      Events:
        CoursesUpdate:
          Type: HttpApi
          Properties:
            ApiId: !Ref TurnityApi
            Path: /courses/{courseId}
            Method: PUT

  CourseDetailFunction:
    Type: AWS::Serverless::Function
    Properties:
