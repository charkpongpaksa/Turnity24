AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: Turnity backend scaffold for AWS SAM

Globals:
  Function:
    Runtime: nodejs20.x
    Timeout: 10
    MemorySize: 256
    CodeUri: ./
    Environment:
      Variables:
        APP_ENV: dev
        CORS_ORIGIN: http://localhost:5173
        TU_API_BASE_URL: https://restapi.tu.ac.th/api/v1/auth/Ad
        DDB_TABLE_NAME: !Ref TurnityTable
        POWERTOOLS_SERVICE_NAME: turnity-backend

Resources:
  TurnityApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      CorsConfiguration:
        AllowMethods:
          - GET
          - POST
          - PUT
          - DELETE
          - OPTIONS
        AllowOrigins:
          - http://localhost:5173
        AllowHeaders:
          - Content-Type
          - Authorization

  TurnityTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
        - AttributeName: GSI1PK
          AttributeType: S
        - AttributeName: GSI1SK
          AttributeType: S
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE
      GlobalSecondaryIndexes:
        - IndexName: GSI1
          KeySchema:
            - AttributeName: GSI1PK
              KeyType: HASH
            - AttributeName: GSI1SK
              KeyType: RANGE
          Projection:
            ProjectionType: ALL

  AuthLoginFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: functions/auth-login/index.handler
      Role: !Sub "arn:aws:iam::${AWS::AccountId}:role/LabRole"
      Events:
        AuthLogin:
          Type: HttpApi
          Properties:
            ApiId: !Ref TurnityApi
            Path: /auth/login
            Method: POST

  CoursesListFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: functions/courses-list/index.handler
      Role: !Sub "arn:aws:iam::${AWS::AccountId}:role/LabRole"
      Events:
        CoursesList:
          Type: HttpApi
          Properties:
            ApiId: !Ref TurnityApi
            Path: /courses
            Method: GET

  CoursesCreateFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: functions/courses-create/index.handler
      Role: !Sub "arn:aws:iam::${AWS::AccountId}:role/LabRole"
      Events:
        CoursesCreate:
          Type: HttpApi
          Properties:
            ApiId: !Ref TurnityApi
            Path: /courses
            Method: POST

  CourseDetailFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: functions/course-detail/index.handler
      Role: !Sub "arn:aws:iam::${AWS::AccountId}:role/LabRole"
      Events:
        CourseDetail:
          Type: HttpApi
          Properties:
            ApiId: !Ref TurnityApi
            Path: /courses/{courseId}
            Method: GET

  CourseStudentsFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: functions/course-students/index.handler
      Role: !Sub "arn:aws:iam::${AWS::AccountId}:role/LabRole"
      Events:
        CourseStudentsList:
          Type: HttpApi
          Properties:
            ApiId: !Ref TurnityApi
            Path: /courses/{courseId}/students
            Method: GET
        CourseStudentsAdd:
          Type: HttpApi
          Properties:
            ApiId: !Ref TurnityApi
            Path: /courses/{courseId}/students
            Method: POST
        CourseStudentsRemove:
          Type: HttpApi
          Properties:
            ApiId: !Ref TurnityApi
            Path: /courses/{courseId}/students/{studentId}
            Method: DELETE

  AnnouncementsListFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: functions/announcements-list/index.handler
      Role: !Sub "arn:aws:iam::${AWS::AccountId}:role/LabRole"
      Events:
        AnnouncementsList:
          Type: HttpApi
          Properties:
            ApiId: !Ref TurnityApi
            Path: /courses/{courseId}/announcements
            Method: GET

  AnnouncementsCreateFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: functions/announcements-create/index.handler
      Role: !Sub "arn:aws:iam::${AWS::AccountId}:role/LabRole"
      Events:
        AnnouncementsCreate:
          Type: HttpApi
          Properties:
            ApiId: !Ref TurnityApi
            Path: /courses/{courseId}/announcements
            Method: POST

  AssignmentsListFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: functions/assignments-list/index.handler
      Role: !Sub "arn:aws:iam::${AWS::AccountId}:role/LabRole"
      Events:
        AssignmentsList:
          Type: HttpApi
          Properties:
            ApiId: !Ref TurnityApi
            Path: /courses/{courseId}/assignments
            Method: GET

  AssignmentsCreateFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: functions/assignments-create/index.handler
      Role: arn:aws:iam::700564400345:role/LabRole
      Events:
        AssignmentsCreate:
          Type: HttpApi
          Properties:
            ApiId: !Ref TurnityApi
            Path: /courses/{courseId}/assignments
            Method: POST

  SubmissionsCreateFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: functions/submissions-create/index.handler
      Role: !Sub "arn:aws:iam::${AWS::AccountId}:role/LabRole"
      Events:
        SubmissionsCreate:
          Type: HttpApi
          Properties:
            ApiId: !Ref TurnityApi
            Path: /assignments/{assignmentId}/submissions
            Method: POST

  SubmissionsListFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: functions/submissions-list/index.handler
      Role: !Sub "arn:aws:iam::${AWS::AccountId}:role/LabRole"
      Events:
        SubmissionsList:
          Type: HttpApi
          Properties:
            ApiId: !Ref TurnityApi
            Path: /assignments/{assignmentId}/submissions
            Method: GET

  DiscussionsCreateFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: functions/discussions-create/index.handler
      Role: !Sub "arn:aws:iam::${AWS::AccountId}:role/LabRole"
      Events:
        DiscussionsCreate:
          Type: HttpApi
          Properties:
            ApiId: !Ref TurnityApi
            Path: /courses/{courseId}/discussions
            Method: POST

  DiscussionsListFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: functions/discussions-list/index.handler
      Role: !Sub "arn:aws:iam::${AWS::AccountId}:role/LabRole"
      Events:
        DiscussionsList:
          Type: HttpApi
          Properties:
            ApiId: !Ref TurnityApi
            Path: /courses/{courseId}/discussions
            Method: GET

  DiscussionsUpdateFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: functions/discussions-update/index.handler
      Role: !Sub "arn:aws:iam::${AWS::AccountId}:role/LabRole"
      Events:
        DiscussionsUpdate:
          Type: HttpApi
          Properties:
            ApiId: !Ref TurnityApi
            Path: /courses/{courseId}/discussions/{discussionId}
            Method: PUT

  DiscussionsDeleteFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: functions/discussions-delete/index.handler
      Role: !Sub "arn:aws:iam::${AWS::AccountId}:role/LabRole"
      Events:
        DiscussionsDelete:
          Type: HttpApi
          Properties:
            ApiId: !Ref TurnityApi
            Path: /courses/{courseId}/discussions/{discussionId}
            Method: DELETE

  DiscussionsLikeFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: functions/discussions-like/index.handler
      Role: !Sub "arn:aws:iam::${AWS::AccountId}:role/LabRole"
      Events:
        DiscussionsLike:
          Type: HttpApi
          Properties:
            ApiId: !Ref TurnityApi
            Path: /courses/{courseId}/discussions/{discussionId}/like
            Method: POST

  DiscussionRepliesCreateFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: functions/comments-create/index.handler
      Role: !Sub "arn:aws:iam::${AWS::AccountId}:role/LabRole"
      Events:
        DiscussionRepliesCreate:
          Type: HttpApi
          Properties:
            ApiId: !Ref TurnityApi
            Path: /courses/{courseId}/discussions/{discussionId}/replies
            Method: POST

  CommentsListFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: functions/comments-list/index.handler
      Role: !Sub "arn:aws:iam::${AWS::AccountId}:role/LabRole"
      Events:
        CommentsList:
          Type: HttpApi
          Properties:
            ApiId: !Ref TurnityApi
            Path: /discussions/{discussionId}/comments
            Method: GET

  NotificationsCreateFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: functions/notifications-create/index.handler
      Role: !Sub "arn:aws:iam::${AWS::AccountId}:role/LabRole"
      Events:
        NotificationsCreate:
          Type: HttpApi
          Properties:
            ApiId: !Ref TurnityApi
            Path: /students/{studentId}/notifications
            Method: POST

  NotificationsListFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: functions/notifications-list/index.handler
      Role: !Sub "arn:aws:iam::${AWS::AccountId}:role/LabRole"
      Events:
        NotificationsList:
          Type: HttpApi
          Properties:
            ApiId: !Ref TurnityApi
            Path: /notifications
            Method: GET

  NotificationsReadFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: functions/notifications-read/index.handler
      Role: !Sub "arn:aws:iam::${AWS::AccountId}:role/LabRole"
      Events:
        NotificationsRead:
          Type: HttpApi
          Properties:
            ApiId: !Ref TurnityApi
            Path: /notifications/{notificationId}/read
            Method: PUT

  NotificationsReadAllFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: functions/notifications-read-all/index.handler
      Role: !Sub "arn:aws:iam::${AWS::AccountId}:role/LabRole"
      Events:
        NotificationsReadAll:
          Type: HttpApi
          Properties:
            ApiId: !Ref TurnityApi
            Path: /notifications/read-all
            Method: PUT

Outputs:
  ApiBaseUrl:
    Description: HTTP API base URL
    Value: !Sub https://${TurnityApi}.execute-api.${AWS::Region}.amazonaws.com
  TableName:
    Description: DynamoDB table name
    Value: !Ref TurnityTable
