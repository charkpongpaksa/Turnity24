AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: Turnity backend scaffold for AWS SAM

Parameters:
  AppEnv:
    Type: String
    Default: dev
  CorsOrigin:
    Type: String
    Default: http://localhost:5173
  AuthTokenSecret:
    Type: String
    NoEcho: true
    Default: ""
  LocalAuthSalt:
    Type: String
    NoEcho: true
    Default: ""
  TuApiApplicationKey:
    Type: String
    NoEcho: true
    Default: ""

Globals:
  Function:
    Runtime: nodejs24.x
    Timeout: 10
    MemorySize: 256
    CodeUri: ./
    Environment:
      Variables:
        APP_ENV: !Ref AppEnv
        CORS_ORIGIN: !Ref CorsOrigin
        TU_API_BASE_URL: https://restapi.tu.ac.th/api/v1/auth/Ad
        DDB_TABLE_NAME: !Ref TurnityTable
        UPLOADS_BUCKET_NAME: !Ref UploadsBucket
        AUTH_TOKEN_SECRET: !Ref AuthTokenSecret
        LOCAL_AUTH_SALT: !Ref LocalAuthSalt
        TU_API_APPLICATION_KEY: !Ref TuApiApplicationKey
        POWERTOOLS_SERVICE_NAME: turnity-backend

Resources:
  TurnityApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      CorsConfiguration:
        AllowMethods:
          - GET
          - POST
          - PUT
          - DELETE
          - OPTIONS
        AllowOrigins:
          - !Ref CorsOrigin
        AllowHeaders:
          - Content-Type
          - Authorization

  TurnityTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
        - AttributeName: GSI1PK
          AttributeType: S
        - AttributeName: GSI1SK
          AttributeType: S
        - AttributeName: GSI2PK
          AttributeType: S
        - AttributeName: GSI2SK
          AttributeType: S
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE
      GlobalSecondaryIndexes:
        - IndexName: GSI1
          KeySchema:
            - AttributeName: GSI1PK
              KeyType: HASH
            - AttributeName: GSI1SK
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
        - IndexName: GSI2
          KeySchema:
            - AttributeName: GSI2PK
              KeyType: HASH
            - AttributeName: GSI2SK
              KeyType: RANGE
          Projection:
            ProjectionType: ALL

  UploadsBucket:
    Type: AWS::S3::Bucket
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      CorsConfiguration:
        CorsRules:
          - AllowedHeaders:
              - "*"
            AllowedMethods:
              - GET
              - PUT
              - POST
              - HEAD
            AllowedOrigins:
              - !Ref CorsOrigin
            MaxAge: 3000

  FrontendBucket:
    Type: AWS::S3::Bucket
    Properties:
      WebsiteConfiguration:
        IndexDocument: index.html
        ErrorDocument: index.html
      PublicAccessBlockConfiguration:
        BlockPublicAcls: false
        BlockPublicPolicy: false
        IgnorePublicAcls: false
        RestrictPublicBuckets: false

  FrontendBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref FrontendBucket
      PolicyDocument:
        Statement:
          - Action: s3:GetObject
            Effect: Allow
            Resource: !Sub "arn:aws:s3:::${FrontendBucket}/*"
            Principal: "*"

  AuthLoginFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: functions/auth-login/index.handler
      Role: !Sub "arn:aws:iam::${AWS::AccountId}:role/LabRole"
      Events:
        AuthLogin:
          Type: HttpApi
          Properties:
            ApiId: !Ref TurnityApi
            Path: /auth/login
            Method: POST

  AuthLogoutFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: functions/auth-logout/index.handler
      Role: !Sub "arn:aws:iam::${AWS::AccountId}:role/LabRole"
