AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Turnity backend scaffold for AWS SAM
Globals:
  Function:
    Runtime: nodejs20.x
    Timeout: 10
    MemorySize: 256
    CodeUri: ./
    Environment:
      Variables:
        APP_ENV: dev
        CORS_ORIGIN: http://localhost:5173
        TU_API_BASE_URL: https://restapi.tu.ac.th/api/v1/auth/Ad
        DDB_TABLE_NAME:
          Ref: TurnityTable
        POWERTOOLS_SERVICE_NAME: turnity-backend
Resources:
  TurnityApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      CorsConfiguration:
        AllowMethods:
        - GET
        - POST
        - PUT
        - DELETE
        - OPTIONS
        AllowOrigins:
        - http://localhost:5173
        AllowHeaders:
        - Content-Type
        - Authorization
  TurnityTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
      - AttributeName: PK
        AttributeType: S
      - AttributeName: SK
        AttributeType: S
      - AttributeName: GSI1PK
        AttributeType: S
      - AttributeName: GSI1SK
        AttributeType: S
      KeySchema:
      - AttributeName: PK
        KeyType: HASH
      - AttributeName: SK
        KeyType: RANGE
      GlobalSecondaryIndexes:
      - IndexName: GSI1
        KeySchema:
        - AttributeName: GSI1PK
          KeyType: HASH
        - AttributeName: GSI1SK
          KeyType: RANGE
        Projection:
          ProjectionType: ALL
  AuthLoginFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: functions/auth-login/index.handler
      Role: arn:aws:iam::028800569612:role/LabRole
      Events:
        AuthLogin:
          Type: HttpApi
          Properties:
            ApiId:
              Ref: TurnityApi
            Path: /auth/login
            Method: POST
      CodeUri: AuthLoginFunction
    Metadata:
      SamResourceId: AuthLoginFunction
  CoursesListFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: functions/courses-list/index.handler
      Role: arn:aws:iam::028800569612:role/LabRole
      Events:
        CoursesList:
          Type: HttpApi
          Properties:
            ApiId:
              Ref: TurnityApi
            Path: /courses
            Method: GET
      CodeUri: CoursesListFunction
    Metadata:
      SamResourceId: CoursesListFunction
  CoursesCreateFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: functions/courses-create/index.handler
      Role: arn:aws:iam::028800569612:role/LabRole
      Events:
        CoursesCreate:
          Type: HttpApi
          Properties:
            ApiId:
              Ref: TurnityApi
            Path: /courses
            Method: POST
      CodeUri: CoursesCreateFunction
    Metadata:
      SamResourceId: CoursesCreateFunction
  CourseDetailFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: functions/course-detail/index.handler
      Role: arn:aws:iam::028800569612:role/LabRole
      Events:
        CourseDetail:
          Type: HttpApi
          Properties:
            ApiId:
              Ref: TurnityApi
            Path: /courses/{courseId}
            Method: GET
      CodeUri: CourseDetailFunction
    Metadata:
      SamResourceId: CourseDetailFunction
  CourseStudentsFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: functions/course-students/index.handler
      Role: arn:aws:iam::028800569612:role/LabRole
      Events:
        CourseStudentsList:
          Type: HttpApi
          Properties:
            ApiId:
              Ref: TurnityApi
            Path: /courses/{courseId}/students
            Method: GET
        CourseStudentsAdd:
          Type: HttpApi
          Properties:
            ApiId:
              Ref: TurnityApi
            Path: /courses/{courseId}/students
            Method: POST
        CourseStudentsRemove:
          Type: HttpApi
          Properties:
            ApiId:
              Ref: TurnityApi
            Path: /courses/{courseId}/students/{studentId}
            Method: DELETE
      CodeUri: CourseStudentsFunction
    Metadata:
      SamResourceId: CourseStudentsFunction
  AnnouncementsListFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: functions/announcements-list/index.handler
      Role: arn:aws:iam::028800569612:role/LabRole
      Events:
        AnnouncementsList:
          Type: HttpApi
          Properties:
            ApiId:
              Ref: TurnityApi
            Path: /courses/{courseId}/announcements
            Method: GET
      CodeUri: AnnouncementsListFunction
    Metadata:
      SamResourceId: AnnouncementsListFunction
  AnnouncementsCreateFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: functions/announcements-create/index.handler
      Role: arn:aws:iam::028800569612:role/LabRole
      Events:
        AnnouncementsCreate:
          Type: HttpApi
          Properties:
            ApiId:
              Ref: TurnityApi
            Path: /courses/{courseId}/announcements
            Method: POST
      CodeUri: AnnouncementsCreateFunction
    Metadata:
      SamResourceId: AnnouncementsCreateFunction
  AssignmentsListFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: functions/assignments-list/index.handler
      Role: arn:aws:iam::028800569612:role/LabRole
      Events:
        AssignmentsList:
          Type: HttpApi
          Properties:
            ApiId:
              Ref: TurnityApi
            Path: /courses/{courseId}/assignments
            Method: GET
      CodeUri: AssignmentsListFunction
    Metadata:
      SamResourceId: AssignmentsListFunction
  AssignmentsCreateFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: functions/assignments-create/index.handler
      Role: arn:aws:iam::028800569612:role/LabRole
      Events:
        AssignmentsCreate:
          Type: HttpApi
          Properties:
            ApiId:
              Ref: TurnityApi
            Path: /courses/{courseId}/assignments
            Method: POST
      CodeUri: AssignmentsCreateFunction
    Metadata:
      SamResourceId: AssignmentsCreateFunction
Outputs:
  ApiBaseUrl:
    Description: HTTP API base URL
    Value:
      Fn::Sub: https://${TurnityApi}.execute-api.${AWS::Region}.amazonaws.com
  TableName:
    Description: DynamoDB table name
    Value:
      Ref: TurnityTable
